# Codemagic: iOS TestFlight build'i.
# Gerekenler (bir kez, Codemagic arayüzünden):
#   1. Personal settings > Integrations > Developer Portal: App Store Connect API anahtarı
#      ("ScaryMob" anahtarı: Emre'nin Apple ekibi G73Q59X7Y6; "Nilemy" başka ekibe ait).
#   2. App Store Connect uygulama kaydı: "Ateşböceği", bundle id com.atesbocegi.game (oluşturuldu).
#   3. Code signing identities: dağıtım sertifikası "scarymob_dist" ve profil "atesbocegi_appstore" Codemagic'e yüklü.
workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ScaryMob
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.atesbocegi.game
      vars:
        XCODE_WORKSPACE: Atesbocegi.xcworkspace
        XCODE_SCHEME: Atesbocegi
        # Test build'lerinde FPS sayacını göster (mağaza sürümünde 0 yapılacak).
        EXPO_PUBLIC_SHOW_FPS: "1"
        # Test build'lerinde Google test reklamları (mağaza sürümünde kaldırılacak).
        EXPO_PUBLIC_ADMOB_TEST: "1"
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Bağımlılıklar
        script: npm ci
      - name: Kontroller (typecheck, test, lint)
        script: |
          npm run typecheck
          npm test -- --ci
          npm run lint
      - name: Expo prebuild (iOS)
        script: npx expo prebuild --platform ios --non-interactive
      - name: CocoaPods
        script: cd ios && pod install
      - name: Build numarası
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "ios/$XCODE_SCHEME/Info.plist"
      - name: İmzalama profillerini uygula
        script: xcode-project use-profiles
      - name: IPA oluştur
        script: |
          xcode-project build-ipa \
            --workspace "ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Android: Google Play dahili test kanalı. Push ile değil, elle başlatılır.
  # Gerekenler (bir kez, Emre):
  #   1. Google Play Console'da "Ateşböceği" uygulaması, paket adı com.atesbocegi.game.
  #   2. Codemagic > Code signing identities > Android keystores: yükleme anahtarı,
  #      referans adı "atesbocegi_upload" (Codemagic arayüzünde oluşturulabilir).
  #   3. Codemagic > Integrations > Google Play: hizmet hesabı JSON'u, adı "atesbocegi_play".
  #   İlk AAB Play Console'a bir kez elle yüklenmeli (Google kuralı); sonrakiler otomatik.
  android-play-internal:
    name: Android Play dahili test
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - atesbocegi_upload
      groups:
        - atesbocegi_play
      vars:
        EXPO_PUBLIC_SHOW_FPS: "1"
        # Test build'lerinde Google test reklamları (mağaza sürümünde kaldırılacak).
        EXPO_PUBLIC_ADMOB_TEST: "1"
      node: 22
      java: 17
    scripts:
      - name: Bağımlılıklar
        script: npm ci
      - name: Kontroller (typecheck, test, lint)
        script: |
          npm run typecheck
          npm test -- --ci
          npm run lint
      - name: Expo prebuild (Android)
        script: npx expo prebuild --platform android --non-interactive
      - name: Sürüm kodu
        script: |
          sed -i "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" android/app/build.gradle
      - name: AAB oluştur
        script: cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

# Codemagic: iOS TestFlight build'i.
# Gerekenler (bir kez, Codemagic arayüzünden):
#   1. Teams > Integrations > Developer Portal: App Store Connect API anahtarını ekle,
#      adını aşağıdaki APP_STORE_CONNECT_INTEGRATION ile aynı yap ("atesbocegi_asc").
#   2. App Store Connect'te bundle id'si com.atesbocegi.game olan uygulama kaydını oluştur.
# Codemagic imzalama sertifikasını ve provisioning profile'ı API anahtarıyla kendisi alır/oluşturur.
workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: atesbocegi_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.atesbocegi.game
      vars:
        XCODE_WORKSPACE: Atesbocegi.xcworkspace
        XCODE_SCHEME: Atesbocegi
        # Test build'lerinde FPS sayacını göster (mağaza sürümünde 0 yapılacak).
        EXPO_PUBLIC_SHOW_FPS: "1"
      node: 22
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Bağımlılıklar
        script: npm ci
      - name: Kontroller (typecheck, test, lint)
        script: |
          npm run typecheck
          npm test -- --ci
          npm run lint
      - name: Expo prebuild (iOS)
        script: npx expo prebuild --platform ios --non-interactive
      - name: CocoaPods
        script: cd ios && pod install
      - name: Build numarası
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "ios/$XCODE_SCHEME/Info.plist"
      - name: İmzalama profillerini uygula
        script: xcode-project use-profiles
      - name: IPA oluştur
        script: |
          xcode-project build-ipa \
            --workspace "ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
